name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Project Dependencies
        run: |
          npm install -g @capacitor/cli
          npm ci || npm install

      - name: Build Web Production Assets (dist)
        run: npm run build

      - name: Ensure Dist Directory Exists
        run: |
          mkdir -p dist
          test -f dist/index.html || echo "<!DOCTYPE html><html><head></head><body></body></html>" > dist/index.html

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor with Android Platform
        run: |
          npx @capacitor/cli add android || true
          npx @capacitor/cli sync android

      - name: Build APK via Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sanad-Accounting-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
