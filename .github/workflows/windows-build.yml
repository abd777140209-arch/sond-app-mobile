name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install electron electron-packager --save-dev

      - name: Build Web Assets
        run: npm run build

      - name: Package Windows EXE
        run: |
          npx electron-packager . "SanadAccounting" --platform=win32 --arch=x64 --out=release --overwrite --main=main.cjs

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanadAccounting-Windows-EXE
          path: release/SanadAccounting-win32-x64/
