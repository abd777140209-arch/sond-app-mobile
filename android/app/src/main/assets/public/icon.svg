<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- White / Subtle Grid Pattern Definition -->
    <pattern id="lightGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E2E8F0" stroke-width="1.2" opacity="0.6"/>
    </pattern>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="softBlueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Squircle Container with Pure White Background -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="#FFFFFF" />
  
  <!-- Subtle Grid Pattern Layer -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#lightGrid)" />
  
  <!-- Outer Subtle Border -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="#E2E8F0" stroke-width="3" />

  <!-- Modern Geometric Blue Logo Emblem (sond) -->
  <g filter="url(#softBlueGlow)" transform="translate(256, 256)">
    <!-- Top-Right Diagonal Wing -->
    <rect x="-90" y="-120" width="180" height="48" rx="24" fill="url(#blueGrad)" transform="rotate(-45)" />
    <!-- Bottom-Left Parallel Wing -->
    <rect x="-90" y="72" width="180" height="48" rx="24" fill="url(#blueGrad)" transform="rotate(-45)" />
    <!-- Center Connecting Cross Member -->
    <rect x="-100" y="-24" width="200" height="48" rx="24" fill="url(#blueGrad)" transform="rotate(45)" />
  </g>
</svg>
