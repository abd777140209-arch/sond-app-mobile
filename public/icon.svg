<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090e17" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e7c4" />
      <stop offset="50%" stop-color="#C5A862" />
      <stop offset="100%" stop-color="#9a7b38" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <stop offset="0%" stop-color="#C5A862" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C5A862" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Rectangle -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4" />
  
  <!-- Decorative Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="12 8" opacity="0.3" />
  
  <!-- Central Emblem / Icon Shield -->
  <path d="M256 96 L368 152 V264 C368 344 256 408 256 408 C256 408 144 344 144 264 V152 Z" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#goldGlow)" />
  
  <!-- Inner Arabic Calligraphy / Stylized 'س' representing Sanad / سُند -->
  <text x="256" y="285" font-family="'Cairo', 'Amiri', 'Tajawal', sans-serif, Arial" font-size="140" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" dominant-baseline="central">سُند</text>
  
  <!-- Small Star Accents -->
  <circle cx="256" cy="140" r="8" fill="url(#goldGrad)" />
</svg>
