<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>نظام سند المحاسبي الذكي</title>
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./pwa-192.png" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="background-color" content="#ffffff" />
    <meta name="description" content="نظام الأندرويد فون الذكي المحاسبي والسحابي إدارة المبيعات والمخزون" />
    
    <!-- iOS / Safari Mobile Specs -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="سُند" />
    <meta name="application-name" content="نظام سُند الذكي" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Safe Service Worker Registration (Web/PWA Only - Skip on Native APK / file:// / capacitor://) -->
    <script>
      const isHttpProtocol = window.location.protocol.startsWith('http');
      const isNativeApp = window.location.protocol.startsWith('file') || window.location.protocol.startsWith('capacitor');
      if ('serviceWorker' in navigator && isHttpProtocol && !isNativeApp) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
